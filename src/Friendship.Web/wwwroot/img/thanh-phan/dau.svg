<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Bóng đổ mềm tự nhiên -->
    <filter id="berryShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#4A0E17" flood-opacity="0.35"/>
    </filter>

    <!-- Gradient thân quả dâu tây đỏ mọng ruby -->
    <radialGradient id="strawberryGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5A76"/>
      <stop offset="35%" stop-color="#E5193E"/>
      <stop offset="75%" stop-color="#B80C28"/>
      <stop offset="100%" stop-color="#730517"/>
    </radialGradient>

    <!-- Ánh sáng phản chiếu bóng bẩy (Specular Gloss) -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradient lá đài dâu tây tươi xanh -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="50%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>

  <g filter="url(#berryShadow)">
    <!-- Thân quả dâu tây dáng trái tim tự nhiên -->
    <path d="M50 20 C68 20, 84 32, 82 52 C80 68, 64 85, 52 93 C50.8 93.8, 49.2 93.8, 48 93 C36 85, 20 68, 18 52 C16 32, 32 20, 50 20 Z"
          fill="url(#strawberryGrad)"/>

    <!-- Vệt sáng bóng kem mọng nước trên vai dâu -->
    <path d="M32 27 C42 23, 58 24, 66 28 C64 33, 40 32, 32 27 Z" fill="url(#glossGrad)"/>
    <ellipse cx="33" cy="38" rx="8" ry="14" transform="rotate(-25 33 38)" fill="url(#glossGrad)" opacity="0.65"/>
    <ellipse cx="30" cy="35" rx="3.5" ry="7" transform="rotate(-25 30 35)" fill="#FFFFFF" opacity="0.8"/>

    <!-- Hạt vừng vàng chìm trong hốc quả (Achenes) -->
    <!-- Hàng 1 -->
    <ellipse cx="38" cy="36" rx="1.3" ry="2.2" transform="rotate(10 38 36)" fill="#FFE082"/>
    <circle cx="38.5" cy="37.2" r="0.8" fill="#5A0410" opacity="0.6"/>

    <ellipse cx="50" cy="35" rx="1.4" ry="2.4" fill="#FFE082"/>
    <circle cx="50" cy="36.4" r="0.8" fill="#5A0410" opacity="0.6"/>

    <ellipse cx="62" cy="37" rx="1.3" ry="2.2" transform="rotate(-10 62 37)" fill="#FFE082"/>
    <circle cx="61.5" cy="38.2" r="0.8" fill="#5A0410" opacity="0.6"/>

    <!-- Hàng 2 -->
    <ellipse cx="28" cy="48" rx="1.3" ry="2.2" transform="rotate(22 28 48)" fill="#FFE082"/>
    <circle cx="28.6" cy="49.2" r="0.8" fill="#5A0410" opacity="0.6"/>

    <ellipse cx="40" cy="47" rx="1.4" ry="2.3" transform="rotate(8 40 47)" fill="#FFE082"/>
    <circle cx="40.5" cy="48.3" r="0.8" fill="#5A0410" opacity="0.6"/>

    <ellipse cx="52" cy="47" rx="1.4" ry="2.4" fill="#FFE082"/>
    <circle cx="52" cy="48.4" r="0.8" fill="#5A0410" opacity="0.6"/>

    <ellipse cx="64" cy="49" rx="1.3" ry="2.2" transform="rotate(-15 64 49)" fill="#FFE082"/>
    <circle cx="63.5" cy="50.2" r="0.8" fill="#5A0410" opacity="0.6"/>

    <ellipse cx="73" cy="51" rx="1.2" ry="2.0" transform="rotate(-25 73 51)" fill="#FFE082"/>

    <!-- Hàng 3 -->
    <ellipse cx="32" cy="61" rx="1.3" ry="2.2" transform="rotate(18 32 61)" fill="#FFE082"/>
    <circle cx="32.5" cy="62.2" r="0.8" fill="#5A0410" opacity="0.6"/>

    <ellipse cx="44" cy="60" rx="1.4" ry="2.3" transform="rotate(5 44 60)" fill="#FFE082"/>
    <circle cx="44.4" cy="61.3" r="0.8" fill="#5A0410" opacity="0.6"/>

    <ellipse cx="56" cy="61" rx="1.4" ry="2.3" transform="rotate(-8 56 61)" fill="#FFE082"/>
    <circle cx="55.6" cy="62.3" r="0.8" fill="#5A0410" opacity="0.6"/>

    <ellipse cx="67" cy="63" rx="1.2" ry="2.0" transform="rotate(-20 67 63)" fill="#FFE082"/>

    <!-- Hàng 4 gần chóp -->
    <ellipse cx="39" cy="74" rx="1.2" ry="2.0" transform="rotate(12 39 74)" fill="#FFE082"/>
    <ellipse cx="50" cy="73" rx="1.3" ry="2.1" fill="#FFE082"/>
    <ellipse cx="60" cy="74" rx="1.2" ry="2.0" transform="rotate(-12 60 74)" fill="#FFE082"/>

    <!-- Chóp dâu -->
    <ellipse cx="46" cy="84" rx="1.0" ry="1.7" transform="rotate(5 46 84)" fill="#FFE082"/>
    <ellipse cx="53" cy="84" rx="1.0" ry="1.7" transform="rotate(-5 53 84)" fill="#FFE082"/>

    <!-- Cuống và 5 cánh lá đài xanh tươi tự nhiên -->
    <!-- Cuống gỗ nhỏ phía trên -->
    <path d="M49 8 C48 14, 47 18, 51 21 C52 21, 53 14, 52 8 Z" fill="#2E7D32"/>
    <path d="M50 8 C49.5 12, 49 16, 51 18" stroke="#81C784" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Cánh lá trái xa -->
    <path d="M48 21 C36 17, 24 18, 19 24 C26 27, 36 26, 47 23 Z" fill="url(#leafGrad1)"/>
    <path d="M48 21 C36 17, 24 18, 19 24" stroke="#81C784" stroke-width="0.7" fill="none"/>

    <!-- Cánh lá phải xa -->
    <path d="M52 21 C64 17, 76 18, 81 24 C74 27, 64 26, 53 23 Z" fill="url(#leafGrad1)"/>
    <path d="M52 21 C64 17, 76 18, 81 24" stroke="#81C784" stroke-width="0.7" fill="none"/>

    <!-- Cánh lá trái gần -->
    <path d="M49 22 C37 23, 27 28, 24 38 C32 35, 41 30, 48 24 Z" fill="url(#leafGrad2)"/>

    <!-- Cánh lá phải gần -->
    <path d="M51 22 C63 23, 73 28, 76 38 C68 35, 59 30, 52 24 Z" fill="url(#leafGrad2)"/>

    <!-- Cánh lá trung tâm chúc xuống -->
    <path d="M47 22 C49 30, 48 35, 50 41 C52 35, 51 30, 53 22 Z" fill="#43A047"/>
    <path d="M50 22 L50 37" stroke="#A5D6A7" stroke-width="0.7" stroke-linecap="round"/>
  </g>
</svg>
