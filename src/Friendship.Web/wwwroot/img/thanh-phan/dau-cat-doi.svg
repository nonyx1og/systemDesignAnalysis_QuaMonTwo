<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Bóng đổ dâu bổ đôi -->
    <filter id="halvedShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#4A0E17" flood-opacity="0.32"/>
    </filter>

    <!-- Viền thịt dâu ngoài đỏ đậm -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4B68"/>
      <stop offset="60%" stop-color="#D81B43"/>
      <stop offset="100%" stop-color="#9C0A23"/>
    </linearGradient>

    <!-- Lòng trong ruột dâu tây trắng kem chuyển hồng -->
    <radialGradient id="fleshGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF8F6"/>
      <stop offset="35%" stop-color="#FFE0E6"/>
      <stop offset="70%" stop-color="#FF99AB"/>
      <stop offset="100%" stop-color="#EB284E"/>
    </radialGradient>
  </defs>

  <g filter="url(#halvedShadow)">
    <!-- Viền dâu bên ngoài -->
    <path d="M50 16 C68 16, 84 28, 82 48 C80 66, 64 84, 52 92 C50.8 92.8, 49.2 92.8, 48 92 C36 84, 20 66, 18 48 C16 28, 32 16, 50 16 Z"
          fill="url(#rimGrad)"/>

    <!-- Mặt thịt cắt dâu -->
    <path d="M50 20 C64 20, 77 30, 75 47 C73 62, 60 78, 51 86 C50.5 86.5, 49.5 86.5, 49 86 C40 78, 27 62, 25 47 C23 30, 36 20, 50 20 Z"
          fill="url(#fleshGrad)"/>

    <!-- Lõi tim dâu trắng hình búp măng -->
    <path d="M50 26 C55 26, 58 36, 55 52 C53 62, 50 72, 50 72 C50 72, 47 62, 45 52 C42 36, 45 26, 50 26 Z"
          fill="#FFFFFF" opacity="0.88"/>

    <!-- Các vân thớ thịt dâu đỏ hồng tỏa ra từ tim -->
    <path d="M48 38 C42 36, 36 39, 32 44" stroke="#FF5374" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M52 38 C58 36, 64 39, 68 44" stroke="#FF5374" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M47 48 C40 48, 35 53, 31 60" stroke="#FF5374" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M53 48 C60 48, 65 53, 69 60" stroke="#FF5374" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M48 58 C43 60, 39 67, 37 72" stroke="#FF5374" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M52 58 C57 60, 61 67, 63 72" stroke="#FF5374" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Hạt li ti ở mép vỏ ngoài -->
    <ellipse cx="23" cy="38" rx="1.0" ry="1.8" transform="rotate(35 23 38)" fill="#FFE082"/>
    <ellipse cx="20" cy="48" rx="1.0" ry="1.8" transform="rotate(20 20 48)" fill="#FFE082"/>
    <ellipse cx="22" cy="58" rx="1.0" ry="1.8" transform="rotate(10 22 58)" fill="#FFE082"/>
    <ellipse cx="77" cy="38" rx="1.0" ry="1.8" transform="rotate(-35 77 38)" fill="#FFE082"/>
    <ellipse cx="80" cy="48" rx="1.0" ry="1.8" transform="rotate(-20 80 48)" fill="#FFE082"/>
    <ellipse cx="78" cy="58" rx="1.0" ry="1.8" transform="rotate(-10 78 58)" fill="#FFE082"/>

    <!-- Cuống xanh phía trên -->
    <path d="M50 8 L50 17" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M49 16 C38 13, 26 14, 20 20 C28 22, 38 21, 48 18 Z" fill="#388E3C"/>
    <path d="M51 16 C62 13, 74 14, 80 20 C72 22, 62 21, 52 18 Z" fill="#388E3C"/>
  </g>
</svg>
