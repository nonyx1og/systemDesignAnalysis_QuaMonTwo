<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="chocoShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#1A0D0A" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="chocoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A453A"/>
      <stop offset="50%" stop-color="#4E2E25"/>
      <stop offset="100%" stop-color="#2D150F"/>
    </linearGradient>
    <linearGradient id="chocoFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D5F52"/>
      <stop offset="100%" stop-color="#4E2E25"/>
    </linearGradient>
  </defs>

  <g filter="url(#chocoShadow)">
    <!-- Phiến socola nghiêng góc 3D -->
    <rect x="18" y="24" width="64" height="52" rx="6" fill="url(#chocoGrad)"/>

    <!-- Ô socola 1 -->
    <rect x="25" y="31" width="22" height="17" rx="3" fill="url(#chocoFacet)"/>
    <path d="M25 31 L47 31 L45 33 L27 33 Z" fill="#A87566" opacity="0.8"/>

    <!-- Ô socola 2 -->
    <rect x="53" y="31" width="22" height="17" rx="3" fill="url(#chocoFacet)"/>
    <path d="M53 31 L75 31 L73 33 L55 33 Z" fill="#A87566" opacity="0.8"/>

    <!-- Ô socola 3 -->
    <rect x="25" y="52" width="22" height="17" rx="3" fill="url(#chocoFacet)"/>
    <path d="M25 52 L47 52 L45 54 L27 54 Z" fill="#A87566" opacity="0.8"/>

    <!-- Ô socola 4 -->
    <rect x="53" y="52" width="22" height="17" rx="3" fill="url(#chocoFacet)"/>
    <path d="M53 52 L75 52 L73 54 L55 54 Z" fill="#A87566" opacity="0.8"/>

    <!-- Rãnh chia socola chữ thập -->
    <line x1="50" y1="28" x2="50" y2="72" stroke="#230E09" stroke-width="2"/>
    <line x1="22" y1="50" x2="78" y2="50" stroke="#230E09" stroke-width="2"/>
  </g>
</svg>
