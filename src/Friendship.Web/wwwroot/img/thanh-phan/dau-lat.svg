<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="sliceShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#4A0E17" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="sliceFlesh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFE8EC"/>
      <stop offset="65%" stop-color="#FF758F"/>
      <stop offset="88%" stop-color="#D81B43"/>
      <stop offset="100%" stop-color="#A00D28"/>
    </radialGradient>
  </defs>

  <g filter="url(#sliceShadow)">
    <!-- Vòng lát dâu tròn hơi méo tự nhiên -->
    <path d="M50 12 C72 11, 88 26, 88 50 C88 74, 72 89, 50 88 C26 89, 12 73, 12 50 C12 27, 27 12, 50 12 Z"
          fill="url(#sliceFlesh)"/>

    <!-- Lõi tâm trắng sao 5 cánh mềm -->
    <path d="M50 38 C52 44, 58 45, 62 48 C57 52, 56 58, 54 62 C50 58, 44 59, 40 56 C44 51, 43 45, 50 38 Z"
          fill="#FFFFFF" opacity="0.9"/>

    <!-- Tia thớ thịt dâu đỏ hồng -->
    <line x1="50" y1="35" x2="50" y2="20" stroke="#FF4D6D" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
    <line x1="60" y1="42" x2="75" y2="30" stroke="#FF4D6D" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
    <line x1="62" y1="55" x2="78" y2="60" stroke="#FF4D6D" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
    <line x1="53" y1="62" x2="55" y2="78" stroke="#FF4D6D" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
    <line x1="42" y1="60" x2="30" y2="74" stroke="#FF4D6D" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
    <line x1="38" y1="50" x2="22" y2="48" stroke="#FF4D6D" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
    <line x1="42" y1="40" x2="28" y2="28" stroke="#FF4D6D" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>

    <!-- Hạt dâu viền ngoài -->
    <circle cx="20" cy="35" r="1.3" fill="#FFE082"/>
    <circle cx="16" cy="50" r="1.3" fill="#FFE082"/>
    <circle cx="22" cy="67" r="1.3" fill="#FFE082"/>
    <circle cx="36" cy="80" r="1.3" fill="#FFE082"/>
    <circle cx="64" cy="81" r="1.3" fill="#FFE082"/>
    <circle cx="78" cy="68" r="1.3" fill="#FFE082"/>
    <circle cx="83" cy="50" r="1.3" fill="#FFE082"/>
    <circle cx="77" cy="32" r="1.3" fill="#FFE082"/>
    <circle cx="63" cy="19" r="1.3" fill="#FFE082"/>
    <circle cx="37" cy="18" r="1.3" fill="#FFE082"/>
  </g>
</svg>
