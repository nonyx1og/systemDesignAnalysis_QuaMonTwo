<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="blBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <radialGradient id="yolkGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="35%" stop-color="#FB923C"/>
      <stop offset="85%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
  </defs>
  <ellipse cx="60" cy="100" rx="46" ry="10" fill="#000" opacity="0.12"/>
  <!-- Cake box container / base -->
  <path d="M18,54 L20,86 C20,96 100,96 100,86 L102,54 Z" fill="url(#blBase)"/>
  <ellipse cx="60" cy="54" rx="42" ry="15" fill="#FDE047"/>
  <!-- Pork floss (Chà bông) layer strands -->
  <path d="M26,50 Q36,44 48,52 Q58,42 70,50 Q82,44 94,52" stroke="#D97706" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M30,54 Q44,48 56,56 Q68,46 80,55 Q90,48 92,54" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M34,48 Q46,54 58,47 Q72,56 86,49" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- Cheese sauce drizzle -->
  <path d="M28,52 C38,58 44,56 50,53 C58,56 66,54 74,52 C82,56 88,54 94,52" stroke="#FEF9C3" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- Salted Egg Yolks (Trứng muối) -->
  <!-- Yolk 1 (left) -->
  <circle cx="44" cy="50" r="10" fill="url(#yolkGrad)"/>
  <ellipse cx="41" cy="46" rx="3" ry="1.5" fill="#FFF" opacity="0.5"/>
  <!-- Yolk 2 (center/right) -->
  <circle cx="68" cy="48" r="11" fill="url(#yolkGrad)"/>
  <ellipse cx="65" cy="44" rx="3.5" ry="2" fill="#FFF" opacity="0.5"/>
  <!-- Yolk 3 (front right) -->
  <circle cx="56" cy="58" r="9" fill="url(#yolkGrad)"/>
  <ellipse cx="53" cy="55" rx="2.5" ry="1.5" fill="#FFF" opacity="0.5"/>
</svg>
