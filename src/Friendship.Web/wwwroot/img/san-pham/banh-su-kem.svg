<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="choux" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <radialGradient id="cream" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <ellipse cx="60" cy="100" rx="42" ry="10" fill="#000" opacity="0.12"/>
  <!-- Bottom shell -->
  <path d="M22,70 C22,94 98,94 98,70 C98,62 88,58 60,58 C32,58 22,62 22,70 Z" fill="url(#choux)" filter="url(#shadow)"/>
  <!-- Cream filling -->
