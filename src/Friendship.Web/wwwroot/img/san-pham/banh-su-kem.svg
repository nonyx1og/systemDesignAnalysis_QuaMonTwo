  <!-- Cream rosettes -->
  <circle cx="44" cy="56" r="6" fill="#FFF"/>
  <circle cx="60" cy="54" r="7" fill="#FFF"/>
  <circle cx="76" cy="56" r="6" fill="#FFF"/>
  <!-- Top shell cap -->
  <path d="M28,52 C26,26 94,26 92,52 C82,46 38,46 28,52 Z" fill="url(#choux)" filter="url(#shadow)"/>
  <!-- Powdered sugar dust -->
  <circle cx="48" cy="36" r="1.5" fill="#FFF" opacity="0.8"/>
  <circle cx="56" cy="32" r="1.5" fill="#FFF" opacity="0.8"/>
  <circle cx="64" cy="34" r="2" fill="#FFF" opacity="0.8"/>
  <circle cx="72" cy="38" r="1.5" fill="#FFF" opacity="0.8"/>
  <circle cx="60" cy="40" r="1.5" fill="#FFF" opacity="0.8"/>
</svg>
