<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="chiffon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="goldenTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="100" rx="46" ry="10" fill="#000" opacity="0.12"/>
  <!-- Cake cylinder base -->
  <path d="M16,52 L16,84 C16,98 104,98 104,84 L104,52 Z" fill="url(#chiffon)"/>
  <!-- Base round shadow -->
  <path d="M16,84 C16,98 104,98 104,84 L104,78 C104,92 16,92 16,78 Z" fill="#CA8A04" opacity="0.5"/>
  <!-- Fluffy top surface -->
  <ellipse cx="60" cy="52" rx="44" ry="17" fill="url(#goldenTop)"/>
  <ellipse cx="60" cy="51" rx="41" ry="15" fill="#F59E0B"/>
  <!-- Cake center crown/cracks -->
  <path d="M42,50 Q60,46 78,50" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M50,47 Q60,53 70,47" stroke="#92400E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- Butter pat / mint leaf on top -->
  <rect x="53" y="42" width="14" height="10" rx="2" fill="#FEF08A" stroke="#FBBF24" stroke-width="1.5"/>
</svg>
