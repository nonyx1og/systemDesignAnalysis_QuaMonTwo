<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="custard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="caramel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="60%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="102" rx="46" ry="10" fill="#000" opacity="0.12"/>
  <!-- Caramel pool on plate -->
  <ellipse cx="60" cy="94" rx="44" ry="10" fill="#9A3412" opacity="0.75"/>
  <!-- Custard body (truncated cone) -->
