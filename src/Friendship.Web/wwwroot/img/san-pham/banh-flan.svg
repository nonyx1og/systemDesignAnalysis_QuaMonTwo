  <!-- Caramel Gloss highlight -->
  <ellipse cx="54" cy="46" rx="14" ry="4" fill="#FFF" opacity="0.45"/>
  <ellipse cx="72" cy="48" rx="6" ry="2" fill="#FFF" opacity="0.3"/>
</svg>
