  <rect x="65" y="58" width="3.5" height="3.5" rx="1" fill="#16A34A" transform="rotate(45 65 58)"/>
  <rect x="58" y="68" width="4" height="3" rx="1" fill="#15803D" transform="rotate(30 58 68)"/>
  <rect x="42" y="48" width="3" height="3" rx="1" fill="#166534"/>
