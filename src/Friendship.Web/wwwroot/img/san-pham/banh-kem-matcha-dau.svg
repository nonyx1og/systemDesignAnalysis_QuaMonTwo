  <circle cx="62" cy="50" r="5.5" fill="url(#whiteCream)"/>
  <circle cx="74" cy="52" r="5" fill="url(#whiteCream)"/>
  <circle cx="84" cy="55" r="5" fill="url(#whiteCream)"/>
